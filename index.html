<!-- a set of drawing sheets, one on screen at a time; js/sheets.js fills them -->
<div class="progress" aria-hidden="true"><i id="progress"></i></div>

<main class="deck" id="deck" aria-live="polite"></main>

<nav class="bar" aria-label="Pages">
  <button class="bar__btn bar__menu" id="menuBtn" type="button" aria-controls="menu" aria-expanded="false">☰ <span>Menu</span></button>
  <button class="bar__btn bar__prev" id="prev" type="button" aria-label="Previous page">‹</button>
  <p class="bar__where" id="where"></p>
  <div class="bar__right">
    <button class="bar__btn bar__next" id="next" type="button"><span>Next</span> ›</button>
  </div>
</nav>

<div class="menu" id="menu" hidden>
  <div class="menu__panel" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
    <div class="menu__head">
      <h2 id="menuTitle">All pages</h2>
      <button class="bar__btn" type="button" data-close aria-label="Close menu">✕</button>
    </div>
    <ol class="register" id="register"></ol>
    <p class="menu__hint">Arrow keys, Page Up / Page Down or a sideways swipe also turn the page.</p>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Picture">
  <button class="bar__btn lightbox__close" id="lbClose" type="button" aria-label="Close picture">✕</button>
  <button class="bar__btn lightbox__prev" id="lbPrev" type="button" aria-label="Previous picture">‹</button>
  <figure><img alt=""><figcaption id="lbCap"></figcaption></figure>
  <button class="bar__btn lightbox__next" id="lbNext" type="button" aria-label="Next picture">›</button>
</div>

<noscript><p class="noscript">This portfolio needs JavaScript to turn its sheets. You can reach Michael at michaelwibo@gmail.com.</p></noscript>

<script src="js/profile.js?v=20261126d"></script>
<script src="js/sheets.js?v=20261126d"></script>
